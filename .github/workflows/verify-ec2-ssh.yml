name: Verify EC2 SSH Authentication

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-ssh:
    name: Test GitHub EC2 SSH Secret
    runs-on: ubuntu-latest

    steps:
      - name: Connect to EC2 and verify identity
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: 16.16.193.85
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "SSH authentication successful!"
            whoami
            hostname
