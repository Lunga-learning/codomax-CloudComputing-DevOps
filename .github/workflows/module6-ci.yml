name: Module 6 - DevOps Project Tracker CI

on:
  push:
    branches:
      - main
    paths:
      - "Module-6-Capstone/**"
      - ".github/workflows/module6-ci.yml"

  pull_request:
    branches:
      - main
    paths:
      - "Module-6-Capstone/**"
      - ".github/workflows/module6-ci.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run Flask Application Tests

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Module-6-Capstone

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Module-6-Capstone/requirements-dev.txt

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run automated tests with coverage
        run: |
          python -m pytest --cov=app --cov-report=term-missing
