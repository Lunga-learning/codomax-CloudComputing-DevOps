name: Module 5 CI Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'Module-5/DevOps-CICD-Monitoring/**'
      - '.github/workflows/module5-ci.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'Module-5/DevOps-CICD-Monitoring/**'
      - '.github/workflows/module5-ci.yml'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-html:
    name: Validate Module 5 HTML
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install HTML validator
        run: python -m pip install html5validator

      - name: Validate application HTML
        run: html5validator --root Module-5/DevOps-CICD-Monitoring --also-check-css

      - name: Report success
        if: success()
        run: echo "Module 5 CI pipeline completed successfully."
