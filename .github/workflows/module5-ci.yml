name: Module 5 CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'Module-5/DevOps-CICD-Monitoring/**'
      - '.github/workflows/module5-ci.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'Module-5/DevOps-CICD-Monitoring/**'
      - '.github/workflows/module5-ci.yml'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-html:
    name: Validate HTML and Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install HTML validator
        run: python -m pip install html5validator

      - name: Validate application HTML
        run: html5validator --root Module-5/DevOps-CICD-Monitoring --also-check-css

      - name: Run automated application tests
        run: python -m unittest discover -s Module-5/DevOps-CICD-Monitoring/tests -v

      - name: Report success
        if: success()
        run: echo "Module 5 CI pipeline and automated tests completed successfully."

  deploy:
    name: Deploy Module 5 to EC2
    runs-on: ubuntu-latest
    needs: validate-html
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Deploy application to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            mkdir -p /var/www/module5
            echo "EC2 SSH connection successful."
