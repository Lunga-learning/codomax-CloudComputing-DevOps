services:
  db:
    image: postgres:17
    container_name: devops-tracker-db
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: devops-tracker-web
    restart: unless-stopped

    env_file:
      - .env

    environment:
      DB_HOST: db
      DB_PORT: "5432"

    ports:
      - "5000:5000"

    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
