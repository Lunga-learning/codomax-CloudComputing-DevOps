name: Module 6 - DevOps Project Tracker CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "Module-6-Capstone/**"
      - ".github/workflows/module6-ci.yml"

  pull_request:
    branches:
      - main
    paths:
      - "Module-6-Capstone/**"
      - ".github/workflows/module6-ci.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run Flask Tests and Build Docker Image
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Module-6-Capstone

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Module-6-Capstone/requirements-dev.txt

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run automated tests with coverage
        run: |
          python -m pytest --cov=app --cov-report=term-missing

      - name: Build Docker image
        run: |
          docker build -t devops-project-tracker:ci .

  deploy:
    name: Deploy Module 6 to EC2
    runs-on: ubuntu-latest
    needs: test

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    concurrency:
      group: module6-ec2-deployment
      cancel-in-progress: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Package application files
        run: |
          tar -czf /tmp/module6-deploy.tar.gz \
            -C Module-6-Capstone \
            app Dockerfile .dockerignore requirements.txt run.py

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Verify EC2 host fingerprint
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          ssh-keyscan -T 10 -t ed25519 "$EC2_HOST" > ~/.ssh/known_hosts

          ACTUAL_FINGERPRINT=$(ssh-keygen -lf ~/.ssh/known_hosts | awk 'NR==1 {print $2}')

          EXPECTED_FINGERPRINT="SHA256:IAqISnZKQujn4SV0IH1UjFktzKyfgU4ONFRcnmbb2iU"

          if [ "$ACTUAL_FINGERPRINT" != "$EXPECTED_FINGERPRINT" ]; then
            echo "EC2 host fingerprint verification failed."
            exit 1
          fi

          echo "EC2 host fingerprint verified."

      - name: Transfer application package
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          scp \
            -o StrictHostKeyChecking=yes \
            /tmp/module6-deploy.tar.gz \
            "ec2-user@${EC2_HOST}:/tmp/module6-deploy-${GITHUB_SHA}.tar.gz"

      - name: Deploy application on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          ssh \
            -o StrictHostKeyChecking=yes \
            "ec2-user@${EC2_HOST}" \
            "DEPLOY_ARCHIVE=/tmp/module6-deploy-${GITHUB_SHA}.tar.gz bash -s" <<'REMOTE'

          set -euo pipefail

          APP_DIR="/home/ec2-user/codomax-CloudComputing-DevOps/Module-6-Capstone"

          cd "$APP_DIR"

          test -f .env.aws
          test -f docker-compose.aws.yml

          tar -xzf "$DEPLOY_ARCHIVE" -C "$APP_DIR"

          rm -f "$DEPLOY_ARCHIVE"

          sudo docker compose \
            --env-file .env.aws \
            -f docker-compose.aws.yml \
            config -q

          sudo docker compose \
            --env-file .env.aws \
            -f docker-compose.aws.yml \
            up -d --build --no-deps web

          echo "Waiting for Module 6 health check..."

          for attempt in $(seq 1 12); do
            if curl -fsS http://127.0.0.1:5000/health; then
              echo
              echo "Module 6 deployment successful."
              exit 0
            fi

            sleep 5
          done

          echo "Module 6 health check failed."
          exit 1
          REMOTE
